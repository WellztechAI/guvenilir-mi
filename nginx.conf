server {
    listen 80;
    server_name _;
    
    # Path where index.html and static assets are located
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Try to find the exact file. If not found, try directory.
        # If neither is found, fallback to index.html (SPA routing).
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
